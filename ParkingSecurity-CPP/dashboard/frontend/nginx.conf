server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /ws {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
    }

    # Live MJPEG camera stream from the native C++ daemon on the Jetson host
    # (port 8090). Proxied here so the dashboard loads it SAME-ORIGIN — a
    # cross-origin multipart/x-mixed-replace <img> is unreliable (the periodic
    # `load` events the watchdog needs don't fire reliably). `/camera/stream`
    # maps to the daemon's `/stream`. proxy_buffering MUST be off for a live
    # stream, else nginx buffers the never-ending response and nothing arrives.
    location /camera/ {
        proxy_pass http://host.docker.internal:8090/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    location /snapshots/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location /student_photos/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    client_max_body_size 10M;
}
