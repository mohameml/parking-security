; Parking Security — runtime configuration.
;
; Paths are resolved relative to the daemon's working directory, which is
; the install dir when launched by systemd (`/opt/parking-security`). Every
; key here can be overridden by a `PARKING_*` env var — see config.cpp for
; the exact names.

[camera]
source_uri     = v4l2:///dev/video0
camera_id      = cam-entrance-01
width          = 1920
height         = 1080
target_fps     = 30
mjpeg_input    = true

[models]
detector_config    = config/face_detection.txt
recognizer_config  = config/face_recognition.txt
detector_engine    = models/det_10g.engine
recognizer_engine  = models/w600k_r50.engine
detector_input_width  = 640
detector_input_height = 640
recognizer_input_size = 112
detection_threshold   = 0.5

[recognition]
embedding_index_path        = data/embeddings.json
similarity_threshold        = 0.45
tta_margin                  = 0.10
max_embeddings_per_person   = 20
progressive_learn_threshold = 0.70
; Min seconds between events for the same person (dedupe on the DB side).
detection_cooldown_sec      = 10
enable_tracker              = true
enable_recognizer           = true

[stream]
; Serves multipart/x-mixed-replace MJPEG at  http://<host>:<port>/
enabled      = true
port         = 8090
jpeg_quality = 70

[database]
; Password is NOT stored here. Set PARKING_DB_URL in the env file loaded by
; systemd (see /etc/parking-security/parking-security.env) or the running
; shell. The default host/user/dbname are fine for the local Docker stack.
connection_string = host=localhost port=5432 user=parking dbname=parking_security
pool_size         = 2

[backend]
; When backend.url is set, events are POSTed to the Python backend so the
; React dashboard gets live WebSocket updates (instant alerts, no refresh).
; Port 8001 targets the C++ stack's OWN backend (ParkingSecurity-CPP/dashboard/).
;
; api_key is loaded from PARKING_CAMERA_API_KEY env var — not hardcoded.
url     = http://localhost:8001
api_key =

[alerts]
; Leave empty to disable. Env overrides: PARKING_TELEGRAM_TOKEN, PARKING_TELEGRAM_CHAT_ID.
telegram_bot_token =
telegram_chat_id   =
smtp_host          = smtp.gmail.com
smtp_port          = 587
smtp_user          =
smtp_password      =
alert_email_to     =

[api]
enabled    = false
bind_host  = 0.0.0.0
bind_port  = 8000

[logging]
; level: trace | debug | info | warn | error | critical
level    = info
log_file = /var/log/parking-security/parking.log
console  = true
